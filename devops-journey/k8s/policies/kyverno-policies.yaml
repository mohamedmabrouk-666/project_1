# =====================================================================
# Kyverno: Policy as Code — الـ cluster نفسه يرفض أي حاجة مخالفة
# المشكلة: "اتفقنا نحط limits" ← حد ينسى ← pod ياكل موارد الـ cluster كله
# =====================================================================
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-resource-limits
spec:
  validationFailureAction: Enforce         # Enforce = يرفض | Audit = يحذّر بس
  background: true
  rules:
    - name: limits-required
      match:
        any:
          - resources: { kinds: [Pod] }
      validate:
        message: "لازم تحدد resources.limits (cpu و memory)"
        pattern:
          spec:
            containers:
              - resources:
                  limits:
                    cpu: "?*"
                    memory: "?*"
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-latest-tag
spec:
  validationFailureAction: Enforce
  rules:
    - name: no-latest
      match:
        any:
          - resources: { kinds: [Pod] }
      validate:
        message: "ممنوع :latest — استخدم tag محدد عشان الـ rollback يبقى دقيق"
        pattern:
          spec:
            containers:
              - image: "!*:latest"
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-non-root
spec:
  validationFailureAction: Enforce
  rules:
    - name: run-as-non-root
      match:
        any:
          - resources: { kinds: [Pod] }
      validate:
        message: "الـ containers لازم تشتغل non-root"
        pattern:
          spec:
            securityContext:
              runAsNonRoot: true
