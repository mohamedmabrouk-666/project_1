# HPA: Auto-scaling — يزوّد/يقلّل عدد الـ pods حسب الحمل
# المشكلة: ضغط مفاجئ يوقّع الموقع | أو دفع فلوس على موارد مش مستخدمة
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: devops-journey
  namespace: devops-journey
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: devops-journey
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70     # % من الـ requests (50m) — محتاج metrics-server
