# External Secrets Operator: يسحب الأسرار من AWS Secrets Manager ويعملها K8s Secret
# المشكلة: الأسرار في Git = كارثة | في Secret عادي = base64 مش تشفير
# الحل: السر يفضل في Secrets Manager، والـ cluster يسحبه وقت الحاجة (مع rotation)
# (مثال — التطبيق الحالي static ومش محتاج أسرار، بس ده الشكل لما تضيف backend)
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: app-secrets
  namespace: devops-journey
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: app-secrets                # اسم الـ K8s Secret اللي هيتعمل
  dataFrom:
    - extract:
        key: devops-journey/dev/app  # اسم السر في AWS (من Terraform)
