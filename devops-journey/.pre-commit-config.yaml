# pre-commit: فحوصات بتشتغل على جهازك قبل أي commit (أسرع طريقة تمسك الغلط)
# التنصيب: pip install pre-commit && pre-commit install
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks                 # يمنع commit فيه secret
        args: ["--config", "security/gitleaks.toml"]
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.96.1
    hooks:
      - id: terraform_fmt            # تنسيق الكود
      - id: terraform_validate       # فحص الـ syntax
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-yaml               # YAML سليم؟
        args: ["--allow-multiple-documents"]
        exclude: helm/                # templates الـ Helm مش YAML صافي
      - id: detect-private-key
      - id: end-of-file-fixer
