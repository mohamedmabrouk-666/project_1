# =====================================================================
# GitHub Actions — نفس فكرة Jenkins بس مُدار من GitHub (من غير سيرفر تديره)
# بيشتغل على: كل Pull Request (فحص بس) + كل push على main (فحص + نشر)
#
# Secrets مطلوبة (Settings → Secrets and variables → Actions):
#   DOCKERHUB_USERNAME , DOCKERHUB_TOKEN
# =====================================================================
name: CI-CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore: ['k8s/deployment.yaml']   # عشان الـ commit اللي بيعمله الـ CI نفسه مايشغّلش loop لا نهائي

# أقل صلاحيات ممكنة للـ GITHUB_TOKEN (Least Privilege)
permissions:
  contents: write          # عشان نعدّل k8s/deployment.yaml
  security-events: write   # عشان نرفع نتايج Trivy على تاب Security

env:
  IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/devops-journey

jobs:
  # ---------------- Job 1: فحوصات الأمان والجودة ----------------
  security-and-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }          # history كامل عشان Gitleaks يفحص كل الـ commits

      - name: Gitleaks (secrets)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: security/gitleaks.toml

      - name: Checkov (Terraform/K8s/Dockerfile misconfig)
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: terraform,kubernetes,dockerfile
          soft_fail: true                  # خليها false لما تصلّح الملاحظات

      - name: Trivy (فحص الملفات والـ IaC)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: config
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: '0'

  # ---------------- Job 2: بناء وفحص ورفع الـ image ----------------
  build-and-push:
    needs: security-and-quality          # مايشتغلش إلا لو الفحوصات عدّت
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build (بدون push لسه)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha            # كاش الـ layers = build أسرع
          cache-to: type=gha,mode=max

      - name: Trivy (فحص الـ image) — يفشّل لو فيه CRITICAL
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          severity: CRITICAL
          exit-code: '1'
          ignore-unfixed: true

      # من هنا ورا: بس على main (مش على الـ Pull Requests)
      - name: Login to Docker Hub
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push
        if: github.ref == 'refs/heads/main'
        run: docker push ${{ env.IMAGE }}:${{ github.sha }}

      # GitOps: نعدّل الـ tag في Git بس. ArgoCD هو اللي ينشر.
      - name: Update manifest
        if: github.ref == 'refs/heads/main'
        run: |
          sed -i "s|image: .*devops-journey:.*|image: ${{ env.IMAGE }}:${{ github.sha }}|" k8s/deployment.yaml
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/deployment.yaml
          git diff --cached --quiet || (git commit -m "ci: deploy ${{ github.sha }}" && git push)
