# إعداد nginx للموقع الـ static

server {
    listen 8080;              # بورت غير مميز (>1024) عشان non-root
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # Security headers: حماية بسيطة من XSS و clickjacking
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer" always;

    location / {
        try_files $uri $uri/ =404;
    }

    # endpoint الصحة: Kubernetes probes + Prometheus blackbox + HEALTHCHECK بيضربوه
    location = /health.json {
        default_type application/json;
        add_header Cache-Control "no-store";   # ماينفعش يتكاشّى وإلا الـ check يبقى كذاب
        try_files $uri =404;
    }

    # metrics لـ Prometheus: عدد الاتصالات والطلبات
    # nginx-prometheus-exporter بيقرا من هنا ويحوّلها لصيغة Prometheus
    # allow/deny: يتفتح من جوه الشبكة الخاصة بس (مش من الإنترنت)
    location = /stub_status {
        stub_status;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow 127.0.0.1;
        deny all;
    }

    # منع الوصول لأي ملف مخفي (.git, .env ...)
    location ~ /\. { deny all; }
}
